<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>n8n Workflow</title>

  <script
    type="module"
    src="https://cdn.jsdelivr.net/npm/@n8n_io/n8n-demo-component/n8n-demo.bundled.js">
  </script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      line-height: 1.5;
    }

    main {
      max-width: 1000px;
      margin: 40px auto;
      padding: 0 20px;
    }

    n8n-demo {
      display: block;
      width: 100%;
      height: 700px;
    }
  </style>
</head>

<body>

<main>

  <h1>AI Utility Ticket Automation</h1>

  <p>
    An n8n workflow that processes incoming utility requests,
    extracts information using AI, retrieves ticket data, and
    routes requests based on their type.
  </p>

  <p>
    <strong>Stack:</strong>
    n8n, AI/LLM, Gmail, Supabase, HubSpot
  </p>

  <hr>

  <h2>Workflow</h2>

  <n8n-demo id="workflow"></n8n-demo>

</main>

<script>
  async function loadWorkflow() {
    const response = await fetch("./workflows/MAIN-OPS-AI.json");

    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }

    const workflow = await response.json();

    document
      .getElementById("workflow")
      .setAttribute("workflow", JSON.stringify(workflow));
  }

  loadWorkflow().catch(error => {
    console.error(error);

    document.getElementById("workflow").innerHTML =
      "<p>Could not load workflow preview.</p>";
  });
</script>

</body>
</html>
